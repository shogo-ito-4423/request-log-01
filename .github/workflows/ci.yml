name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build integration test container
        run: docker compose -f compose.integration.yaml build test
      - name: PostgreSQL migration and CRUD tests
        run: docker compose -f compose.integration.yaml run --rm test
      - name: Logs
        if: failure()
        run: docker compose -f compose.integration.yaml logs
      - name: Clean up CI containers and disposable data
        if: always()
        run: docker compose -f compose.integration.yaml down --volumes
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build test container
        run: docker compose --profile test build test
      - name: Ruff and pytest
        run: docker compose --profile test run --rm test
      - name: Generate ephemeral smoke credentials
        run: |
          docker compose --profile test run --rm --no-deps test python -c 'import hashlib,json,secrets; t=secrets.token_urlsafe(32); print("API_TOKEN="+t); print("AUTH_USERS_JSON="+json.dumps([{"user_id":"ci-smoke","role":"user","token_sha256":hashlib.sha256(t.encode()).hexdigest()}]))' >> "$GITHUB_ENV"
      - name: Start API
        run: |
          docker compose build api
          docker compose run --rm --no-deps api alembic upgrade head
          docker compose up --detach --wait api
      - name: Exercise API and save a record
        run: >-
          docker compose exec -T api python - create
          --base-url http://127.0.0.1:8000 --state /data/smoke-state.json
          < scripts/smoke.py
      - name: Recreate API container and check persisted data
        run: |
          docker compose up --detach --force-recreate --wait api
          docker compose exec -T api python - verify --base-url http://127.0.0.1:8000 --state /data/smoke-state.json < scripts/smoke.py
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Clean up CI containers and disposable data
        if: always()
        run: docker compose --profile test down --volumes
